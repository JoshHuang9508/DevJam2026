events {}

pid /tmp/nginx.pid;
error_log /dev/stderr;

http {
  server_tokens off;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  # Docker embedded DNS. Variable proxy_pass re-resolves `web` after recreates.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  server {
    listen 8080;

    auth_basic "DevJam2026";
    auth_basic_user_file /etc/nginx/auth/.htpasswd;

    location = /healthz {
      auth_basic off;
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location / {
      set $upstream_web web;
      proxy_pass http://$upstream_web:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Agent responses use SSE. Do not buffer or impose a short read timeout.
      proxy_buffering off;
      proxy_request_buffering off;
      proxy_read_timeout 1h;
      proxy_send_timeout 1h;
    }
  }
}
