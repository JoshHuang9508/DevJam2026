name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 前端 typecheck / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # better-sqlite3 的 install script 會叫 node-gyp，但 v13 已內建
      # prebuilds/linux-x64.node，跳過 script 反而是唯一穩定的裝法。
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: better-sqlite3 prebuild 可用嗎
        run: node -e "const D=require('better-sqlite3'); new D(':memory:').exec('create table t(a)'); console.log('better-sqlite3 OK')"

      - run: pnpm exec tsc --noEmit

      # 必須在 pnpm test 之前：lib/db/client.test.ts 會真的開 data/app.db，
      # 而 data/*.db 有 gitignore，checkout 出來是空的。
      - run: pnpm db:push && pnpm db:seed

      - run: pnpm test

      - run: pnpm build

  backend:
    name: 後端 typecheck / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      # --ignore-workspace 是必要的：pnpm 會往上找到根目錄的 pnpm-workspace.yaml，
      # 而 backend 不在它的 packages 清單裡，於是依賴不會被連進 backend/node_modules。
      # install 仍然「成功」，直到 tsc 才以 TS2307 爆出來（@earendil-works/* 找不到）。
      # 本機看不出來 —— backend/node_modules 是在根目錄 workspace 檔存在之前就裝好的。
      - run: pnpm install --frozen-lockfile --ignore-scripts --ignore-workspace

      - run: pnpm typecheck

      # 測試用 memory repository 與 deterministic runtime，不呼叫付費模型
      - run: pnpm test

      - run: pnpm build

  e2e:
    name: 端對端（/classic）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm db:push && pnpm db:seed

      # playwright.config 的 webServer 會自己起 pnpm dev。
      # CI 下 reuseExistingServer 為 false，確保測到的是這份程式碼。
      - run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    name: 映像檔可建置
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只驗證 Dockerfile 能建起來，不推到任何 registry。
      # 正式部署是在伺服器上 build（見 .github/workflows/deploy.yml）。
      - name: build backend image
        run: docker build -t anjia-backend:ci ./backend

      - name: build web image
        run: docker build -t anjia-web:ci .
