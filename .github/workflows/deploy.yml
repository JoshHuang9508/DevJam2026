name: CI and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devjam-production
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pin actions to immutable commits. The comments retain the readable release.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.29.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml

      - name: Check frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec tsc --noEmit
          pnpm build

      - name: Check backend
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile --ignore-scripts --ignore-workspace
          pnpm typecheck
          pnpm build

      - name: Validate production Compose file
        run: docker compose -f docker-compose.prod.yml config --quiet

  deploy:
    name: Deploy over restricted SSH
    needs: check
    if: >-
      github.repository == 'JoshHuang9508/DevJam2026' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in DEPLOY_HOST DEPLOY_PORT DEPLOY_USER DEPLOY_KNOWN_HOSTS DEPLOY_SSH_KEY; do
            if [[ -z ${!name:-} ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Configure restricted SSH key
        shell: bash
        env:
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" >"$RUNNER_TEMP/ssh/deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" >"$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/deploy_key"
          chmod 0644 "$RUNNER_TEMP/ssh/known_hosts"

      - name: Install Cloudflare SSH proxy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://github.com/cloudflare/cloudflared/releases/download/2026.9.1/cloudflared-linux-amd64 \
            --output "$RUNNER_TEMP/cloudflared"
          printf '%s  %s\n' \
            '03f1f25d1cc93b9ad6c60569d44060bc4f17ed97075760ed8cfca4b12dcd68cc' \
            "$RUNNER_TEMP/cloudflared" | sha256sum --check --status
          chmod 0755 "$RUNNER_TEMP/cloudflared"

      - name: Deploy exact main commit
        shell: bash
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh \
            -i "$RUNNER_TEMP/ssh/deploy_key" \
            -p "$DEPLOY_PORT" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o "ProxyCommand=$RUNNER_TEMP/cloudflared access ssh --hostname %h" \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $GITHUB_SHA"

      - name: Verify public endpoint
        if: ${{ vars.PUBLIC_URL != '' }}
        shell: bash
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -euo pipefail
          base="${PUBLIC_URL%/}"
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --max-time 30 "$base/" >/dev/null
          body=$(curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 3 \
            --max-time 30 "$base/api/agent/session")
          node -e '
            const body = JSON.parse(process.argv[1]);
            if (!body.backendUp || !body.listingsDb) process.exit(1);
          ' "$body"
