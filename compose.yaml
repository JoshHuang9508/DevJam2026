name: devjam2026

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      REPOSITORY_MODE: memory
      AGENT_MODE: ${AGENT_MODE:-auto}
      PI_PROVIDER: ${PI_PROVIDER:-google}
      PI_MODEL: ${PI_MODEL:-gemini-flash-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CUSTOM_OPENAI_BASE_URL: ${CUSTOM_OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      CUSTOM_OPENAI_API_KEY: ${CUSTOM_OPENAI_API_KEY:-ollama}
      CUSTOM_OPENAI_MODEL_NAME: ${CUSTOM_OPENAI_MODEL_NAME:-Custom OpenAI-compatible model}
      CUSTOM_OPENAI_CONTEXT_WINDOW: ${CUSTOM_OPENAI_CONTEXT_WINDOW:-128000}
      CUSTOM_OPENAI_MAX_TOKENS: ${CUSTOM_OPENAI_MAX_TOKENS:-32000}
      CUSTOM_OPENAI_REASONING: ${CUSTOM_OPENAI_REASONING:-false}
      CUSTOM_OPENAI_SUPPORTS_DEVELOPER_ROLE: ${CUSTOM_OPENAI_SUPPORTS_DEVELOPER_ROLE:-false}
      CUSTOM_OPENAI_SUPPORTS_REASONING_EFFORT: ${CUSTOM_OPENAI_SUPPORTS_REASONING_EFFORT:-false}
      CUSTOM_OPENAI_SUPPORTS_USAGE_IN_STREAMING: ${CUSTOM_OPENAI_SUPPORTS_USAGE_IN_STREAMING:-false}
      CUSTOM_OPENAI_SUPPORTS_STRICT_MODE: ${CUSTOM_OPENAI_SUPPORTS_STRICT_MODE:-false}
      FRONTEND_URL: http://web:3000
      TWINKLE_API_KEY: ${TWINKLE_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:3000}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-1048576}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:3001
      DATABASE_PATH: /app/data/app.db
      ENABLE_BACKEND_PROXY: ${ENABLE_BACKEND_PROXY:-false}
    volumes:
      - app-data:/app/data:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/agent/session').then(async r=>{const j=await r.json();process.exit(r.ok&&j.backendUp&&j.listingsDb?0:1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  gateway:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${BASIC_AUTH_FILE:-./deploy/.htpasswd}:/etc/nginx/auth/.htpasswd:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  data-refresh:
    profiles: ["tools"]
    build:
      context: ./frontend
      target: tools
    volumes:
      - app-data:/app/data
    environment:
      DATABASE_PATH: /app/data/app.db
      PIPELINE_CACHE_DIR: /app/data/cache
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-anjia-housing-agent/0.1 (+https://github.com/JoshHuang9508/DevJam2026)}
      NOMINATIM_EMAIL: ${NOMINATIM_EMAIL:-}
      GEOCODE_BUDGET: ${GEOCODE_BUDGET:-250}
      CWA_API_KEY: ${CWA_API_KEY:-}
      MOENV_API_KEY: ${MOENV_API_KEY:-}

volumes:
  app-data:
