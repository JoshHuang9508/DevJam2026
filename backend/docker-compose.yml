services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: home_selector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - home-selector-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d home_selector"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  home-selector-pg:

