# 正式環境：只有前端對外，後端只存在於 compose 內網。
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 機密放在同目錄的 .env（compose 會自動載入，且有 gitignore）。
#
# 對外由 cloudflare tunnel 打到 127.0.0.1:3000。後端刻意不寫 ports：
# 一旦發布到主機，35.236.161.192:3001 就會是一個完全沒有驗證的 API。
# 前端用 service name 連它就好，瀏覽器只看得到前端的 /api/*。

services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      # 沒有 PostgreSQL，session 存在記憶體，重啟會清空
      REPOSITORY_MODE: memory
      AGENT_MODE: ${AGENT_MODE:-auto}
      PI_PROVIDER: ${PI_PROVIDER:-google}
      PI_MODEL: ${PI_MODEL:-gemini-flash-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CUSTOM_OPENAI_BASE_URL: ${CUSTOM_OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      CUSTOM_OPENAI_API_KEY: ${CUSTOM_OPENAI_API_KEY:-ollama}
      # 後端只被前端從 compose 內網呼叫，瀏覽器不會直接連它；
      # 這裡填公開 origin 只是為了萬一開了 /api/backend/* 代理時仍然正確。
      # agent 的 rank_listings 透過這個位址借用前端的物件資料庫與計分器。
      # 這是 web -> backend -> web 的回呼，不是啟動相依：backend 先起來也沒關係，
      # 這條路只有在 agent 真的呼叫 rank_listings 時才會用到。
      FRONTEND_URL: http://web:3000
      # Twinkle Hub MCP（台灣政府開放資料聚合）。沒設就整組 tool 不註冊，
      # agent 看不到也就不會嘗試呼叫。
      TWINKLE_API_KEY: ${TWINKLE_API_KEY:-}
      # Tavily 網頁搜尋。沒設就不註冊 web_search。
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:3000}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-1048576}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    extra_hosts:
      - host.docker.internal:host-gateway

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:3001
      DATABASE_PATH: /app/data/app.db
      # /api/backend/* 是後端的無驗證全方法代理。正式環境維持關閉；
      # app 本身用不到它，只有想從瀏覽器直接看 Swagger 才需要。
      ENABLE_BACKEND_PROXY: ${ENABLE_BACKEND_PROXY:-false}
    volumes:
      - app-data:/app/data:ro
    ports:
      # 只綁 loopback：cloudflared 跑在同一台主機上，走 127.0.0.1 就好。
      # 綁 0.0.0.0 會讓 GCP 防火牆成為唯一一道防線。
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/agent/session').then(async r=>{const j=await r.json();process.exit(r.ok&&j.backendUp&&j.listingsDb?0:1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 資料抓取 pipeline。profiles 讓它不會被 `up -d` 帶起來 ——
  # 這是一次性的批次工作，不是常駐服務。跑法：
  #   docker compose -f docker-compose.prod.yml run --rm data-refresh
  # 或用包好的 deploy/refresh-data.sh（給 cron 用）。
  data-refresh:
    profiles: ["tools"]
    build:
      context: ./frontend
      target: tools
    volumes:
      - app-data:/app/data
    environment:
      DATABASE_PATH: /app/data/app.db
      PIPELINE_CACHE_DIR: /app/data/cache
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-anjia-housing-agent/0.1 (+https://github.com/JoshHuang9508/DevJam2026)}
      NOMINATIM_EMAIL: ${NOMINATIM_EMAIL:-}
      GEOCODE_BUDGET: ${GEOCODE_BUDGET:-250}
      CWA_API_KEY: ${CWA_API_KEY:-}
      MOENV_API_KEY: ${MOENV_API_KEY:-}

volumes:
  app-data:
