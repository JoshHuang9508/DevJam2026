# 正式環境：只有 Nginx Basic Auth gateway 對外，Web 與後端只存在於 compose 內網。
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# 機密放在同目錄的 .env（compose 會自動載入，且有 gitignore）。
#
# 對外由 cloudflare tunnel 打到 127.0.0.1:3000 的 gateway。後端刻意不寫 ports：
# 一旦發布到主機，35.236.161.192:3001 就會是一個完全沒有驗證的 API。
# 前端用 service name 連它就好，瀏覽器必須先通過 Basic Auth 才看得到 /api/*。

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: home_selector
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d home_selector"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "dist/database/migrate.js"]
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/home_selector

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      REPOSITORY_MODE: postgres
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/home_selector
      EMBEDDING_MODE: ${EMBEDDING_MODE:-hash}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      FACT_EXTRACTION_MODE: ${FACT_EXTRACTION_MODE:-auto}
      FACT_EXTRACTION_MODEL: ${FACT_EXTRACTION_MODEL:-}
      FACT_EXTRACTION_BASE_URL: ${FACT_EXTRACTION_BASE_URL:-}
      FACT_EXTRACTION_API_KEY: ${FACT_EXTRACTION_API_KEY:-}
      ASSESSMENT_MODE: ${ASSESSMENT_MODE:-auto}
      ASSESSMENT_MODEL: ${ASSESSMENT_MODEL:-}
      ASSESSMENT_BASE_URL: ${ASSESSMENT_BASE_URL:-}
      ASSESSMENT_API_KEY: ${ASSESSMENT_API_KEY:-}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-zhuchao-housing-agent/0.1 (+https://github.com/JoshHuang9508/DevJam2026)}
      NOMINATIM_EMAIL: ${NOMINATIM_EMAIL:-}
      GEOCODE_BUDGET: ${GEOCODE_BUDGET:-250}
      GEOCODE_MIN_INTERVAL_MS: ${GEOCODE_MIN_INTERVAL_MS:-1100}
      PIPELINE_POLL_INTERVAL_MS: ${PIPELINE_POLL_INTERVAL_MS:-60000}
      PIPELINE_FETCH_TIMEOUT_MS: ${PIPELINE_FETCH_TIMEOUT_MS:-30000}
      AGENT_MODE: ${AGENT_MODE:-auto}
      PI_PROVIDER: ${PI_PROVIDER:-google}
      PI_MODEL: ${PI_MODEL:-gemini-flash-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CUSTOM_OPENAI_BASE_URL: ${CUSTOM_OPENAI_BASE_URL:-http://host.docker.internal:11434/v1}
      CUSTOM_OPENAI_API_KEY: ${CUSTOM_OPENAI_API_KEY:-ollama}
      CUSTOM_OPENAI_MODEL_NAME: ${CUSTOM_OPENAI_MODEL_NAME:-Custom OpenAI-compatible model}
      CUSTOM_OPENAI_CONTEXT_WINDOW: ${CUSTOM_OPENAI_CONTEXT_WINDOW:-128000}
      CUSTOM_OPENAI_MAX_TOKENS: ${CUSTOM_OPENAI_MAX_TOKENS:-32000}
      CUSTOM_OPENAI_REASONING: ${CUSTOM_OPENAI_REASONING:-false}
      CUSTOM_OPENAI_SUPPORTS_DEVELOPER_ROLE: ${CUSTOM_OPENAI_SUPPORTS_DEVELOPER_ROLE:-false}
      CUSTOM_OPENAI_SUPPORTS_REASONING_EFFORT: ${CUSTOM_OPENAI_SUPPORTS_REASONING_EFFORT:-false}
      CUSTOM_OPENAI_SUPPORTS_USAGE_IN_STREAMING: ${CUSTOM_OPENAI_SUPPORTS_USAGE_IN_STREAMING:-false}
      CUSTOM_OPENAI_SUPPORTS_STRICT_MODE: ${CUSTOM_OPENAI_SUPPORTS_STRICT_MODE:-false}
      # 後端只被前端從 compose 內網呼叫，瀏覽器不會直接連它；
      # 這裡填公開 origin 只是為了萬一開了 /api/backend/* 代理時仍然正確。
      # Twinkle Hub MCP（台灣政府開放資料聚合）。沒設就整組 tool 不註冊，
      # agent 看不到也就不會嘗試呼叫。
      TWINKLE_API_KEY: ${TWINKLE_API_KEY:-}
      # Tavily 網頁搜尋。沒設就不註冊 web_search。
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-http://localhost:3000}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-1048576}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    extra_hosts:
      - host.docker.internal:host-gateway

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://backend:3001
      # /api/backend/* 是後端的無驗證全方法代理。正式環境維持關閉；
      # app 本身用不到它，只有想從瀏覽器直接看 Swagger 才需要。
      ENABLE_BACKEND_PROXY: ${ENABLE_BACKEND_PROXY:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/agent/session').then(async r=>{const j=await r.json();process.exit(r.ok&&j.backendUp?0:1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  gateway:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      # Cloudflare Tunnel only reaches this authenticated entry point.
      - "127.0.0.1:${APP_PORT:-3000}:8080"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${BASIC_AUTH_FILE:-./deploy/.htpasswd}:/etc/nginx/auth/.htpasswd:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # 免金鑰的內政部實價登錄更新工作。資料在 backend 解析並直接寫入
  # PostgreSQL；profiles 確保平常 up 不會重複執行。
  data-refresh:
    profiles: ["tools"]
    build:
      context: ./backend
    # Named volumes are created as root; this short-lived trusted importer needs
    # write access to its download cache and has no published ports or host mounts.
    user: "0:0"
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["node", "dist/scripts/refresh-lvr.js"]
    volumes:
      - pipeline-cache:/app/cache
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/home_selector
      EMBEDDING_MODE: ${EMBEDDING_MODE:-hash}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      PIPELINE_CACHE_DIR: /app/cache
      LVR_CACHE_MAX_AGE_HOURS: ${LVR_CACHE_MAX_AGE_HOURS:-12}

volumes:
  postgres-data:
  pipeline-cache:
